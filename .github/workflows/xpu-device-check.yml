name: XPU Device Header Checks
on: [push, pull_request]
permissions: {}
# rdma/fi_xpu_device.h is only ever compiled by an application's kernel
# compiler, never by the libfabric build, so install libfabric and compile a
# source that calls every entry point in it with each compiler the header
# supports: from a __global__ kernel for CUDA and HIP, from a kernel lambda for
# SYCL, and from a plain function on the host. Calling them from a kernel is
# what makes the compiler check them as device code. Nothing is linked or run,
# so no GPU is needed.
env:
  SRC: xpu_device.c
  XPU_CHECK_SRC: |
    #if defined(__HIPCC__)
    #include <hip/hip_runtime.h>
    #endif
    #include <rdma/fi_xpu_device.h>

    #if defined(__CUDACC__) || defined(__HIPCC__)
    #define XPU_CHECK_KERNEL __global__ void
    #else
    #define XPU_CHECK_KERNEL void
    #endif

    XPU_CHECK_KERNEL
    xpu_device_check(struct fid_xpu_ep *ep, struct fid_xpu_cq *cq,
    		 struct fid_xpu_cntr *cntr, void *buf, void *desc, void *addr,
    		 fi_wr wr, const struct fi_wr_attr *attr, int scope,
    		 int64_t *out)
    {
    	size_t wr_len = 0;
    	int64_t r = 0;

    	r += fi_xpu_send(ep, buf, 64, desc, 0, addr, NULL, 0, scope);
    	r += fi_xpu_recv(ep, buf, 64, desc, addr, NULL, 0, scope);
    	r += fi_xpu_write(ep, buf, 64, desc, 0, addr, 0, 0, NULL, 0, scope);
    	r += fi_xpu_read(ep, buf, 64, desc, addr, 0, 0, NULL, 0, scope);
    	r += fi_xpu_tsend(ep, buf, 64, desc, 0, addr, 0, NULL, 0, scope);
    	r += fi_xpu_trecv(ep, buf, 64, desc, addr, 0, 0, NULL, 0, scope);
    	r += fi_xpu_atomic(ep, buf, 1, desc, addr, 0, 0, 0, 0, NULL, 0, scope);
    	r += fi_xpu_fetch_atomic(ep, buf, 1, desc, buf, desc, addr, 0, 0, 0, 0,
    				 NULL, 0, scope);
    	r += fi_xpu_compare_atomic(ep, buf, 1, desc, buf, desc, buf, desc,
    				   addr, 0, 0, 0, 0, NULL, 0, scope);

    	r += fi_xpu_wr_prepare(ep, attr, wr, &wr_len, scope);
    	r += fi_xpu_wr_queue_tx(ep, wr, NULL, scope);
    	r += fi_xpu_wr_queue_recv(ep, wr, NULL, scope);
    	r += fi_xpu_wr_queue_trecv(ep, wr, NULL, scope);
    	r += fi_xpu_tx_flush(ep, 0, scope);
    	r += fi_xpu_recv_flush(ep, 0, scope);
    	r += fi_xpu_trecv_flush(ep, 0, scope);
    	r += fi_xpu_wr_modify_addr(ep, wr, FI_OP_SEND, addr, scope);
    	r += fi_xpu_wr_modify_iov(ep, wr, FI_OP_SEND, NULL, desc, 0, scope);
    	r += fi_xpu_wr_modify_rma_iov(ep, wr, FI_OP_WRITE, NULL, 0, scope);
    	r += fi_xpu_wr_modify_tag(ep, wr, FI_OP_TSEND, 0, 0, scope);
    	r += fi_xpu_wr_modify_data(ep, wr, FI_OP_SEND, 0, scope);
    	r += fi_xpu_wr_modify_flags(ep, wr, FI_OP_SEND, 0, scope);

    	r += (int64_t) fi_xpu_cntr_read(cntr, scope);
    	r += (int64_t) fi_xpu_cntr_readerr(cntr, scope);
    	fi_xpu_cntr_wait(cntr, 1, -1, scope);
    	r += fi_xpu_cntr_add(cntr, 1, scope);
    	r += fi_xpu_cntr_set(cntr, 1, scope);
    	r += fi_xpu_cntr_adderr(cntr, 1, scope);
    	r += fi_xpu_cntr_seterr(cntr, 1, scope);

    	r += fi_xpu_cq_read(cq, buf, 1, scope);
    	r += fi_xpu_cq_readfrom(cq, buf, 1, NULL, scope);
    	r += fi_xpu_cq_readerr(cq, buf, 0, scope);
    	r += fi_xpu_cq_sread(cq, buf, 1, 1, scope);
    	r += fi_xpu_cq_sreadfrom(cq, buf, 1, NULL, 1, scope);

    	*out = r + (int64_t) wr_len;
    }

    #if defined(SYCL_LANGUAGE_VERSION)
    #include <sycl/sycl.hpp>

    /* Device code in SYCL is whatever a kernel reaches. */
    void xpu_device_check_launch(sycl::queue &q, struct fid_xpu_ep *ep,
    			     struct fid_xpu_cq *cq, struct fid_xpu_cntr *cntr,
    			     void *buf, void *desc, void *addr, fi_wr wr,
    			     const struct fi_wr_attr *attr, int scope,
    			     int64_t *out)
    {
    	q.single_task([=]() {
    		xpu_device_check(ep, cq, cntr, buf, desc, addr, wr, attr,
    				 scope, out);
    	});
    }
    #endif
jobs:
  host:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v4.3.1
      - name: Install libfabric
        run: |
          sudo apt-get install -y autoconf automake libtool
          ./autogen.sh
          ./configure --prefix=$PWD/install
          make -j 2 install
      - name: Host compilers
        run: |
          set -x
          printf '%s\n' "$XPU_CHECK_SRC" > $SRC
          gcc -x c -std=c11 -Wall -Werror -I$PWD/install/include -c $SRC -o /dev/null
          g++ -x c++ -Wall -Werror -I$PWD/install/include -c $SRC -o /dev/null
          clang++ -x c++ -Wall -Werror -I$PWD/install/include -c $SRC -o /dev/null
  cuda:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Install CUDA
        run: |
          sudo apt-get update
          # clang before 19 cannot take GCC 14's libstdc++ in a CUDA compile,
          # and the runner has GCC 14.
          sudo apt-get install -y nvidia-cuda-toolkit clang-20
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v4.3.1
      - name: Install libfabric
        run: |
          sudo apt-get install -y autoconf automake libtool
          ./autogen.sh
          ./configure --prefix=$PWD/install
          make -j 2 install
      - name: CUDA compilers
        run: |
          set -x
          printf '%s\n' "$XPU_CHECK_SRC" > $SRC
          nvcc -x cu -arch=sm_90 -Werror all-warnings -I$PWD/install/include -c $SRC -o /dev/null
          clang++-20 -x cuda --cuda-path=/usr/lib/cuda --cuda-gpu-arch=sm_90 \
            -Wall -Werror -I$PWD/install/include -c $SRC -o /dev/null
  hip:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Install ROCm
        run: |
          sudo mkdir -p /etc/apt/keyrings
          wget -qO- https://repo.radeon.com/rocm/rocm.gpg.key | gpg --dearmor | sudo tee /etc/apt/keyrings/rocm.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/6.4.1 noble main" | sudo tee /etc/apt/sources.list.d/rocm.list
          # Ubuntu packages an older hipcc with a higher version number, so the
          # ROCm repository has to win or apt takes that one.
          printf 'Package: *\nPin: release o=repo.radeon.com\nPin-Priority: 600\n' | sudo tee /etc/apt/preferences.d/rocm-pin-600
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends hipcc hip-dev rocm-llvm rocm-device-libs
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v4.3.1
      - name: Install libfabric
        run: |
          sudo apt-get install -y autoconf automake libtool
          ./autogen.sh
          ./configure --prefix=$PWD/install
          make -j 2 install
      - name: HIP compiler
        run: |
          set -x
          printf '%s\n' "$XPU_CHECK_SRC" > $SRC
          /opt/rocm/bin/hipcc -x hip --offload-arch=gfx90a -Wall -Werror -I$PWD/install/include -c $SRC -o /dev/null
  sycl:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Install oneAPI DPC++
        run: |
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends intel-oneapi-compiler-dpcpp-cpp
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v4.3.1
      - name: Install libfabric
        run: |
          sudo apt-get install -y autoconf automake libtool
          ./autogen.sh
          ./configure --prefix=$PWD/install
          make -j 2 install
      - name: SYCL compiler
        run: |
          set -x
          printf '%s\n' "$XPU_CHECK_SRC" > $SRC
          . /opt/intel/oneapi/setvars.sh
          icpx -fsycl -x c++ -Wall -Werror -I$PWD/install/include -c $SRC -o /dev/null
